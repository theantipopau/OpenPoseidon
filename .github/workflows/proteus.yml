# Proteus CI (G3). Fast gates on every push/PR; heavy builds on main + manual dispatch.
# No GPU jobs: device tests run on Lavapipe (Mesa software Vulkan) in rust-tests.
# Format checks cover CHANGED files only, so pre-existing drift never fails the build.
name: proteus

on:
  push:
    branches:
      - 'proteus/**'
      - 'dev/**'
  pull_request:
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: 'clear;x-gha,read-write'

jobs:
  assets:
    name: asset registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - run: python scripts/proteus/check-assets.py
      - run: python scripts/proteus/perf_parse.py --selftest
      - run: python scripts/proteus/imgdiff.py --selftest

  fmt-changed:
    name: format (changed hunks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Hunk-scoped (check-format.py): plain rustfmt recurses from a crate root
      # into every module and clang-format flags whole files, so both fail on
      # drift the ticket never touched. Same script as local check-all.ps1.
      - name: toolchains for format check
        run: |
          rustup component add rustfmt
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
      - name: check format of changed hunks
        run: |
          # Compare against the Proteus line, not origin/main: origin/main is the fork's
          # upstream tip and sits ~169 files behind the line, so merge-base against it
          # re-checks every hunk on the line and fails on drift no ticket touched -- the
          # exact failure this hunk scoping exists to prevent. Local check-all.ps1 uses
          # the same base.
          BASE="$(git merge-base HEAD origin/proteus/main 2>/dev/null || git merge-base HEAD origin/main 2>/dev/null || true)"
          # A push to proteus/main leaves origin/proteus/main == HEAD, which would make the
          # gate find nothing to check; fall back to the previous commit in that case.
          if [ -z "$BASE" ] || [ "$BASE" = "$(git rev-parse HEAD)" ]; then
            BASE="$(git rev-parse HEAD^)"
          fi
          echo "format base: $BASE"
          python scripts/proteus/check-format.py --base "$BASE"

  rust-tests:
    name: rust unit tests (Lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        # The runner image ships rustup + stable, and `fmt-changed` already relies on it
        # (`rustup component add rustfmt`). There is no `actions-rust-lang/rustup`
        # action; that reference failed the whole job in "Set up job" (unresolvable
        # action), so no Rust test had ever run. Print the versions instead of adding a
        # third-party action dependency: a missing toolchain fails here, on a step that
        # says what it is for, rather than permanently poisoning the job.
        run: |
          rustc --version
          cargo --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: software Vulkan for device tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers
      - run: cargo test -p wgpu_renderer --lib
        env:
          WGPU_BACKEND: vulkan

  rust-tests-validation-layer:
    # The Khronos validation layer only runs when asked for (see headless_instance() in
    # rust/src/lib.rs): it is not safe to initialise from several test threads at once, so
    # its pass must be serial, and serial on software Vulkan is slow. Hence main + manual
    # dispatch, not every PR. This is the job that keeps the layer's best-practice checks
    # from rotting now that the default suite no longer loads it.
    name: rust unit tests (validation layer, serial)
    if: github.ref == 'refs/heads/proteus/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        # Same as `rust-tests`: the image's stable toolchain, no action to resolve.
        run: |
          rustc --version
          cargo --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Separate key: this job writes the same target dir with different env vars, so
          # it must not hand the fast lane a cache built by the serial pass.
          key: ${{ runner.os }}-cargo-layer-${{ hashFiles('**/Cargo.lock') }}
      - name: software Vulkan + Khronos validation layer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-validationlayers
      - name: layer must be present, or the pass would silently prove nothing
        run: |
          ls /usr/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json \
            || ls /usr/share/vulkan/implicit_layer.d/VkLayer_khronos_validation.json
      - name: serial pass with the SDK layer enabled
        run: cargo test -p wgpu_renderer --lib -- --test-threads=1
        env:
          WGPU_BACKEND: vulkan
          WGPU_VALIDATION: '1'

  build-linux:
    name: build (linux-x64-clang-rwdi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vcpkg pinned baseline predates shallow clones; need full history.
          fetch-depth: 0
      - name: toolchain
        run: |
          sudo apt-get update -qq
          # autoconf/automake/libtool: vcpkg's libxcrypt port (a dependency of the
          # manifest on Linux) builds through autoreconf and stops with BUILD_FAILED
          # on a runner that has none of them. The `Ninja` error printed after it is a
          # cascade: the toolchain include aborts inside CMakeDetermineSystem, so CMake
          # never resolves the generator's build program -- ninja-build is enough.
          sudo apt-get install -y -qq clang ninja-build cmake ccache python3-pip pkg-config \
            autoconf autoconf-archive automake libtool \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev \
            libxss-dev libgl1-mesa-dev libasound2-dev libpulse-dev
          python3 -m pip install Pillow numpy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - run: cmake --preset linux-x64-clang-rwdi
      # Directory form, not `--build --preset`: this file defines configure presets only,
      # so a build preset of the same name does not exist.
      - run: cmake --build build/linux-x64-clang-rwdi --target PoseidonGame
      # No ctest step: this job links the game only, and the C++ suite's test entries are
      # per case, so every one of them would fail on an executable that was never built.
      # `cpp-tests` builds and runs that suite.

  build-windows:
    # Windows runners + full vcpkg build are slow: main pushes and manual runs only.
    name: build (win-x64-clang-rwdi)
    if: github.ref == 'refs/heads/proteus/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          echo "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKG_KEEP_ENV_VARS=LLVM_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: cmake --preset win-x64-clang-rwdi
      - run: cmake --build build/win-x64-clang-rwdi --target PoseidonGame
      # The test binaries are not built here; `cpp-tests` builds and runs them.

  cpp-tests:
    name: C++ unit tests (win-x64-clang-rwdi)
    # Until this job existed no CI run executed a single C++ test case: the build jobs
    # link PoseidonGame only, so the registered Catch2 tests had no executables, and
    # `ctest` either found nothing to run or failed on a test it could not find. Windows
    # is the platform the suite is developed and run on (docs/proteus/TOOLCHAIN-1.md).
    # A cold configure + build of the engine and the test targets is heavy, so this runs
    # on the Proteus line and on dispatch, like build-windows.
    if: github.ref == 'refs/heads/proteus/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          echo "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKG_KEEP_ENV_VARS=LLVM_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: cmake --preset win-x64-clang-rwdi
      - name: build the test binaries
        # PoseidonStudioTests is left out: it includes imgui_te_engine.h, which only the
        # imgui "test-engine" vcpkg feature installs, and vcpkg.json does not request it
        # (docs/proteus/G3b-cpp-tests.md). A target that cannot compile would block the
        # whole gate, so the six suites that do build are built here.
        run: cmake --build build/win-x64-clang-rwdi -j 4 --target PoseidonCoreTests PoseidonTests PoseidonEvaluatorTests PoseidonServerTests PoseidonTetrisTests PoseidonFoundationTests
      - name: run
        # -E names three cases, and nothing else is excluded:
        #   * two are red on every machine -- they scan the source for invariants the code
        #     does not hold yet (FIXTURE-SKIP-1 known failures 1 and 2);
        #   * one needs an installed Arma/DayZ corpus, so its answer is a property of the
        #     machine (known failure 3): it SKIPs here, and on a developer box with an
        #     off-revision install it fails, which is not something this gate can decide.
        # So green here means the other ~3,900 cases passed. Fixture-dependent cases SKIP
        # themselves and list what they could not cover at the end of the run.
        # --no-tests=error: a build that produced no tests must fail, not pass vacuously.
        run: >
          ctest --test-dir build/win-x64-clang-rwdi
          -E "Dev panel controls all go through the search filter|WGPU instance translation storage belongs exclusively to the consumer|Compat smoke - each generation's models are the revision that generation ships"
          --output-on-failure --no-tests=error
