# Proteus CI (G3). Fast gates on every push/PR; heavy builds on main + manual dispatch.
# No GPU jobs: device tests run on Lavapipe (Mesa software Vulkan) in rust-tests.
# Format checks cover CHANGED files only, so pre-existing drift never fails the build.
name: proteus

on:
  push:
    branches:
      - 'proteus/**'
      - 'dev/**'
  pull_request:
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: 'clear;x-gha,read-write'

jobs:
  assets:
    name: asset registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - run: python scripts/proteus/check-assets.py
      - run: python scripts/proteus/perf_parse.py --selftest
      - run: python scripts/proteus/imgdiff.py --selftest

  fmt-changed:
    name: format (changed hunks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Hunk-scoped (check-format.py): plain rustfmt recurses from a crate root
      # into every module and clang-format flags whole files, so both fail on
      # drift the ticket never touched. Same script as local check-all.ps1.
      - name: toolchains for format check
        run: |
          rustup component add rustfmt
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
      - name: check format of changed hunks
        run: |
          # Compare against the Proteus line, not origin/main: origin/main is the fork's
          # upstream tip and sits ~169 files behind the line, so merge-base against it
          # re-checks every hunk on the line and fails on drift no ticket touched -- the
          # exact failure this hunk scoping exists to prevent. Local check-all.ps1 uses
          # the same base.
          BASE="$(git merge-base HEAD origin/proteus/main 2>/dev/null || git merge-base HEAD origin/main 2>/dev/null || true)"
          # A push to proteus/main leaves origin/proteus/main == HEAD, which would make the
          # gate find nothing to check; fall back to the previous commit in that case.
          if [ -z "$BASE" ] || [ "$BASE" = "$(git rev-parse HEAD)" ]; then
            BASE="$(git rev-parse HEAD^)"
          fi
          echo "format base: $BASE"
          python scripts/proteus/check-format.py --base "$BASE"

  rust-tests:
    name: rust unit tests (Lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/rustup@v1
        with:
          toolchain: stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: software Vulkan for device tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers
      - run: cargo test -p wgpu_renderer --lib
        env:
          WGPU_BACKEND: vulkan

  rust-tests-validation-layer:
    # The Khronos validation layer only runs when asked for (see headless_instance() in
    # rust/src/lib.rs): it is not safe to initialise from several test threads at once, so
    # its pass must be serial, and serial on software Vulkan is slow. Hence main + manual
    # dispatch, not every PR. This is the job that keeps the layer's best-practice checks
    # from rotting now that the default suite no longer loads it.
    name: rust unit tests (validation layer, serial)
    if: github.ref == 'refs/heads/proteus/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/rustup@v1
        with:
          toolchain: stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Separate key: this job writes the same target dir with different env vars, so
          # it must not hand the fast lane a cache built by the serial pass.
          key: ${{ runner.os }}-cargo-layer-${{ hashFiles('**/Cargo.lock') }}
      - name: software Vulkan + Khronos validation layer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-validationlayers
      - name: layer must be present, or the pass would silently prove nothing
        run: |
          ls /usr/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json \
            || ls /usr/share/vulkan/implicit_layer.d/VkLayer_khronos_validation.json
      - name: serial pass with the SDK layer enabled
        run: cargo test -p wgpu_renderer --lib -- --test-threads=1
        env:
          WGPU_BACKEND: vulkan
          WGPU_VALIDATION: '1'

  build-linux:
    name: build (linux-x64-clang-rwdi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vcpkg pinned baseline predates shallow clones; need full history.
          fetch-depth: 0
      - name: toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang ninja-build cmake ccache python3-pip pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev \
            libxss-dev libgl1-mesa-dev libasound2-dev libpulse-dev
          python3 -m pip install Pillow numpy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - run: cmake --preset linux-x64-clang-rwdi
      - run: cmake --build --preset linux-x64-clang-rwdi --target PoseidonGame
      - run: ctest --test-dir build/linux-x64-clang-rwdi --output-on-failure

  build-windows:
    # Windows runners + full vcpkg build are slow: main pushes and manual runs only.
    name: build (win-x64-clang-rwdi)
    if: github.ref == 'refs/heads/proteus/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          echo "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKG_KEEP_ENV_VARS=LLVM_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: cmake --preset win-x64-clang-rwdi
      - run: cmake --build --preset win-x64-clang-rwdi --target PoseidonGame
      - run: ctest --test-dir build/win-x64-clang-rwdi --output-on-failure
