    evidence: 'MSERVER-CLAIM-RESERVE-1 and MSERVER-CLAIM-LEASE-1 follow-up, requested by the owner. A revision that keeps its folder reserved nothing: the catalog lookup already excluded other entries, but two publishes of one entry both passed the read-only answer and both streamed, and the loser was refused only at artifact placement after the whole upload. Keeping a folder now takes the same claim and token as any other publish: reserve_folder_claim always mints a token and answers renewAfterMs, and the claim the installing publish left is rewritten with the new token and lease. StoredClaim::lease_held makes the take arms lease-aware: Reserve refuses only a live token and takes a lapsed one over with a new token and deadline, while Plain refuses while the lease runs and clears a lapsed leftover (what a renewal that raced a consume becomes). folder_reserved_refusal words the 409 once for the reservation and the preflight. check_install_folder reads the entry own claim and reports a live keeps-folder reservation as unavailable with claimedBy naming that entry, so the read-only fallback also stops before packing. abort_folder_claim drops the catalog test - a kept-folder reservation is taken while the entry installs there, so the token is the only test that can release a failed revision; a token the upload consumed is gone, and one a racing renewal writes back only deletes a claim the catalog explains. scan_catalog adds UnusedClaimReason::LapsedReservation for a claim whose entry installs into its folder and whose token lease ran out; may_still_be_finishing is false and --fix removes it at any age with the row lapsed reservation: folder is reserved for entry, whose reservation stopped renewing, while a live keeps-folder reservation stays invisible because it is the folder record. Tests: four store tests (a second publish of one entry refused at the reservation with the same answer from the preflight, the upload consuming the token, abort releasing a kept folder, a lapsed token taken over and its old renewal refused, a lapsed claim reported once and removed at zero age, a leftover token refused while live and cleared once lapsed), the route test keeps-folder half (200 token plus renewAfterMs, 409, unavailable with claimedBy alpha, abort 204; the post-publish abort now reads belongs to another publish), one check-names case (report exit 1, --fix removes, clean afterwards) and two CLI round-trips (a kept-folder reservation renewed before packing, a token-less older master leaving no renewal or abort). Measured deltas: refusing every token in the Reserve arm fails the lapsed-takeover test on the second unwrap, and dropping the LapsedReservation arm fails the check-names case on its first row. Master 120 lib + 7 bin + 17 integration, CLI 20 + 7, client 15, 0 failed (117 + 7 + 16, 20 + 5 and 15 before); rustfmt clean on the three crates, clippy exit 0 with no diagnostic in the new items, check-all OK and roadmap 59 tickets. Manual on Windows (127.0.0.1:18120, temp db and mods root): a publish into alpha-dir left a plain claim, a keeps-folder reservation answered a 64-character token and renewAfterMs 200000 and wrote the hash plus lease_until, a second reservation of alpha answered 409 before packing and the preflight answered available:false with claimedBy alpha and the same refusal, check-names --fix during the live lease printed the clean sentence and exit 0, the same claim with lease_until 1 printed the lapsed row and exit 1, --fix removed it and exit 0, and after ageing a fresh token a second reservation answered 200 with a new token, the old renewal 409, and the new abort 204 leaving no claim and alpha still installing into alpha-dir. Risks: a leftover token from the renewal-consume race refuses its own entry for the rest of its lease instead of being cleared at once, a live keeps-folder reservation is invisible in a report-only sweep, the second publish must retry rather than queue, an older CLI is now refused while a newer publisher holds the folder it also keeps, an abort matching a re-written token deletes a claim the catalog explains, the preflight can name the caller own entry in claimedBy, and takeover trusts the master clock.'
