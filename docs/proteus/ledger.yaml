    evidence: 'MSERVER-CLAIM-MOVES-1 follow-up, requested by the owner, and the last one on this chain. The read-only preflight let two publishers of one folder both pass it and both stream; the loser was refused only when the claim was taken at finalize, after the whole compressed artifact had arrived (a large mod takes minutes to pack and the transfer takes minutes to hours). A POST to the same route now reserves: reserve_folder_claim resolves the claim through the new resolve_claim helper (the same one check_install_folder uses), takes it with the same conditional put and answers FolderClaimReservation; the token is 32 random bytes from new_claim_token, returned once and written into StoredClaim::token only as SHA-256, so the publisher can prove it made the reservation without the store holding the secret. ClaimTake Plain/Reserve/Consume replaces the plain take: Reserve writes the token and refuses a claim that already carries another publish token; Consume requires the hash and rewrites the body token-less before the revision is placed; Plain on a tokened claim is refused with reserved by a publish of that entry that has not finished. A second reservation of the same entry is refused, and a token that is not the claim token is refused by the hash comparison. InstallFolderReservation::created became owned: a claim this call created, or one whose token it consumed, is released when the publish fails, while a claim from an earlier publish of the entry is still left alone. commit_folder_claim clears the token idempotently and refuses while the entry does not install into the folder; abort_folder_claim checks the catalog first and then deletes only when the token matches, so a conclusive abort frees the folder at once instead of at the sweep age floor, and an abort after the publish cannot remove a live claim. A revision that keeps its folder reserves no token: unused_claims ignores a claim whose entry installs into that folder, so a token there could never be aged out and would block that entry forever. The HTTP layer adds the reserve, commit and abort routes, the claimToken multipart field and a shared folder_claim_mod_id; the upload conflict mapping now includes reserved by. The CLI reserves before build_artifact_reader, sends claimToken, aborts on any failure and commits after success, and falls back to the old GET preflight on 404 (an older master). Tests: seven store tests (lease shape and sweep reading, no token / wrong token / right token / abort refused / idempotent commit, a failed upload releasing the consumed claim, commit before the publish, abort freeing the folder, a keeps-folder revision reserving nothing, and a move that aborts back and then commits), one route test (401, 200 with a token, 409 for a second entry, 409 and an empty catalog for an untokened upload, the tokened upload publishing, 409 abort, 204 commit), one CLI prelude test and the two round-trip cases now asserting the reservation and abort requests. Broken-state delta: consuming without owning makes the failed-upload test fail on the reservation surviving its publish; accepting any token makes the upload test fail on unwrap_err of an Ok entry. Counts: master 112 lib + 7 bin + 15 integration, 0 failed (104 + 7 + 15 before); CLI 20 + 4 (19 + 4 before) and client 15 unchanged; rustfmt clean on the seven files; clippy exit 0 with no warning in a new item; check-all OK with the roadmap regenerated. Manual on Windows: publish into alpha-dir succeeded, a second publisher with the same folder and a nonexistent source was refused before packing, the published claim held no token, and a gamma-dir reservation answered a 64-char token, aborted 204 and left only the alpha claim; a second abort answered 404. Risks: the five-minute floor was sized for a claim taken at finalize, so --fix more than five minutes into a large pack or upload can delete a live lease; a publisher that dies between reserving and aborting leaves a token that refuses that entry until the