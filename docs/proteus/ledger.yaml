a leftover token cleared), one route test (204/409/404), one check-names case (an hour old claim with a live lease kept) and one CLI round-trip (renew before packing, abort after). Measured deltas: without the sweep lease skip two tests fail, without the keeps_folder arm the leftover test fails, without the immediate CLI renewal the round-trip sees three requests instead of four. Master 117 lib + 7 bin + 16 integration, CLI 20 + 5, client 15, 0 failed; rustfmt and clippy clean on the new items; check-all OK, roadmap 58 tickets. Manual on Windows: a publish consumed its token (no lease in the claim), a reservation answered a token and renewAfterMs 200000 and wrote lease_until, check-names --fix kept it with the new wording and exit 1, a wrong-token renewal answered 409, a renewal while its lease was still fresh answered 204 and left the claim byte-identical, and the same renewal after its lease was aged into the past answered 204 and wrote a new deadline with the token unchanged; the abort left only the published claim. Risks: a crash strands the folder for the lease, the renewal is read-then-write without a conditional update (one request window), an in-flight renewal can re-create a claim after an abort until the lease lapses, a report-only sweep still fails during a live publish, and a lease-less master keeps the old behaviour.'
