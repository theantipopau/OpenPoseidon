leasing it frees the folder), a_failed_publish_releases_the_folder_it_reserved (a stray revision object fails placement, no claim remains, the retry publishes), deleting_a_mod_frees_the_folder_it_reserved, and a_revision_that_moves_releases_the_folder_it_left (the old folder is taken by another entry, the new one is refused to others, the owner is still allowed). Counts: master 97 lib + 7 bin + 8 integration, 0 failed (92 + 7 + 8 before); CLI 19 + 4 and client 15 unchanged; clippy exit 0 with no warning in the new code; check-format and check-all OK; roadmap regenerated (52 tickets). Live on Windows with two 2 MB random sources published at the same instant into one folder: beta exit 0, alpha exit 1 with publish rejected: HTTP 409 ... already claimed by catalog entry beta as SHARED, one catalog entry, one claim 736861726564.json {modId:beta,folder:SHARED}, _incoming empty; the claim query then answered gamma unavailable, a third publish stopped before uploading, beta revision 2 moved the claim to beta-new and gamma took Shared, DELETE beta released beta-new and delta took it, and check-names finished clean at 2 entries. Risks: a crash between the put and the release leaves a stale claim (no TTL, because a lease could expire under a slow writer and reopen the race), the claim is taken at finalize so both publishers still stream, pre-reservation entries stay read-only until their next revision, and a mod id of exactly _claims shares the directory.'
