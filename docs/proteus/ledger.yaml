  - id: MSERVER-CLAIM-CAS-1
    title: a claim write carries the generation it was decided against, so a renewal cannot resurrect a consumed token
    branch: proteus/main (direct)
    status: done-unverified
    files:
      - mserver/MasterService/src/mods.rs
      - mserver/MasterService/src/http.rs
      - mserver/CLI/src/main.rs
