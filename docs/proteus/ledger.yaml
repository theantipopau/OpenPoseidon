    toggle: n/a (additive; a claim without a generation reads as 0, and the write window is an internal object no client or sweep sees as a claim)
    evidence: 'MSERVER-CLAIM-LEASE-1 and MSERVER-CLAIM-KEEP-1 follow-up, requested by the owner. A claim write was a read followed by a blind put: object_store 0.11 has no conditional update on the local backend, so a renewal that read a token-bearing claim just before the upload consumed it wrote the token back with a fresh deadline, and the folder then refused its own entry next revision for up to ten minutes; two renewals from one body could shorten each other lease, and a renewal in flight when its publish aborted could re-create the claim. StoredClaim gains generation (u64, serde default, read as 0 for every older body); the initial Create writes 1 and every rewrite stores one more. rewrite_claim becomes a compare-and-set returning bool: it takes a per-claim write window (claim_write_marker, _claims/<hex>.json.writing, created with the same If-None-Match / hard_link rule as the claim, and invisible to is_claim_file), reads the body, and writes only while the stored generation equals the one the caller read. lock_claim retries ten times 20 ms apart and clears a marker older than five seconds (a master that died inside the window); unlock_claim is best effort, because the guarded write already landed and a scanner holding the marker open must not turn it into a reported failure. reserve_install_folder keeps its Create for a free folder and loops on AlreadyExists, deciding again from the body that won instead of writing the first-read decision; renew_folder_claim and commit_folder_claim loop the same way (a consume that lands first turns the renewal into the token-less success, a takeover into 409); abort_folder_claim, remove_unused_claims and release_claims_of (entry delete) delete through delete_claim_if, which re-reads body and write time under the window and deletes only while the token, the scan body and its write time, or the named entry, still hold. claim_error maps changed while it was being ... and being claimed by several publishes to 409. Three store tests: a renewal holding the pre-consume body cannot write the token back and the next revision is accepted at once; a held window refuses a second writer, leaves the body byte-identical, is not seen by the sweep, and releases; deleting an entry whose claim window a writer holds leaves the claim, and the next delete after the release removes it. Measured deltas: accepting any generation fails the first on a write decided against the pre-consume body must not land, and bypassing lock_claim fails the second on a writer that cannot take the window must not write; deleting unconditionally in release_claims_of fails the third on a claim a writer holds is not deleted under it. Master 123 lib + 7 bin + 17 integration, CLI 20 + 7, client 15, 0 failed (120 + 7 + 17, 20 + 7 and 15 before); rustfmt clean, clippy exit 0 with the same 32 library warnings and none in a new item, check-all OK, roadmap 60 tickets. Manual on Windows (127.0.0.1:18130, cas-key, temp db and mods root): a publish left generation 2 with no token, a keeps-folder reservation wrote token and lease at generation 3 with renewAfterMs 200000, a fresh renewal answered 204 and left the claim byte-identical, a marker held by hand made the renewal answer 409 changed while it was being renewed with the claim unchanged, the same renewal after 5 s cleared the marker and wrote generation 4, check-names saw one row for one claim and never the window file, --fix with that window held reported the lapsed reservation as kept, the claim changed after the scan and left it, the next --fix after 5 s cleared the window and removed the claim, and a revision-2 publish of alpha consumed its token and left generation 2. Risks: three extra object operations per claim write, a hung master can still land its stale body if nothing else changed, a fixed five second window expiry on the master clock, an older master defeats the compare for writes that land through it, contention answers 409 rather than queueing, and a sweep can report a claim it did not remove.'
    gpu_verified: false
    follow_ups:
      - sweep stale write windows too, so a marker left by a master that died is removed even when nothing writes its claim again
      - use the S3 PutMode::Update mode when the backend is S3, so a claim write is one request there and the marker remains the local-backend path
